resolver 127.0.0.11 valid=10s ipv6=off;

upstream studio_api_upstream {
  zone studio_api_upstream 64k;
  server studio-api:8000 resolve;
}

upstream transcriber_upstream {
  zone transcriber_upstream 64k;
  server transcriber:8080 resolve;
}

upstream folia_renderer_upstream {
  zone folia_renderer_upstream 64k;
  server folia-renderer:8091 resolve;
}

server {
  listen 80;
  server_name _;
  auth_basic "Folia Lyrics Video Studio";
  auth_basic_user_file /etc/nginx/.htpasswd;
  client_max_body_size 2m;
  root /usr/share/nginx/html;
  index index.html;
  location = /api/ws/lyric { auth_basic off; proxy_pass http://studio_api_upstream/api/ws/lyric; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 86400s; }
  location = /api/ws/clock { auth_basic off; proxy_pass http://studio_api_upstream/api/ws/clock; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 86400s; }
  location /api/ { proxy_pass http://studio_api_upstream; proxy_http_version 1.1; proxy_set_header Host $host; proxy_buffering off; proxy_read_timeout 7200s; }
  location /folia-native/ {
    proxy_pass http://folia_renderer_upstream/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Accept-Encoding "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 7200s;
    sub_filter_once on;
    sub_filter '<head>' '<head><script>if(navigator.serviceWorker){navigator.serviceWorker.register=()=>Promise.reject(new Error("disabled in studio iframe"));}</script><script src="/folia-studio-bridge.js"></script>';
  }
  # The pinned Vite build uses root-relative assets and /obs/events. Keep the
  # iframe same-origin so Basic Auth and media playback continue to work.
  location /assets/ {
    alias /usr/share/nginx/folia-native/assets/;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }
  location = /obs/events { proxy_pass http://folia_renderer_upstream/obs/events; proxy_http_version 1.1; proxy_buffering off; proxy_cache off; proxy_read_timeout 86400s; }
  location = /icon.svg { alias /usr/share/nginx/folia-native/icon.svg; }
  location = /runtime-config.js { alias /usr/share/nginx/folia-native/runtime-config.js; }
  location = /manifest.webmanifest { alias /usr/share/nginx/folia-native/manifest.webmanifest; }
  location = /registerSW.js { alias /usr/share/nginx/folia-native/registerSW.js; }
  # Retire the root-scoped service worker shipped by Fonia. Older versions
  # could keep serving a stale Studio shell even after a successful deploy.
  location = /sw.js { alias /usr/share/nginx/html/sw-kill.js; add_header Cache-Control "no-store"; }
  location = /workbox-9c191d2f.js { alias /usr/share/nginx/folia-native/workbox-9c191d2f.js; }
  location = /folia-cover-sw.js { alias /usr/share/nginx/folia-native/folia-cover-sw.js; }
  location = /stage-client.html { alias /usr/share/nginx/folia-native/stage-client.html; }
  location = /folia-studio-bridge.js { alias /usr/share/nginx/html/folia-studio-bridge.js; add_header Cache-Control "no-store"; }
  location = /healthz { proxy_pass http://studio_api_upstream/healthz; }
  location = /transcriber { return 302 /transcriber/; }
  location /transcriber/ { proxy_pass http://transcriber_upstream/; proxy_http_version 1.1; proxy_set_header Host $host; proxy_buffering off; proxy_read_timeout 7200s; }
  location = / { add_header Cache-Control "no-store"; try_files /index.html =404; }
  location = /index.html { add_header Cache-Control "no-store"; }
  location / { try_files $uri $uri/ /index.html; }
}
