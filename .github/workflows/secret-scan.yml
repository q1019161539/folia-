name: Source secret scan
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test offline guard
        run: python3 -m unittest discover -s ops/security -p 'test_*.py'
      - name: Check current source and all reachable history
        run: python3 ops/security/scan_secrets.py --history
      - name: Gitleaks (pinned binary and checksum, no service credentials)
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          task_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location --retry 2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$task_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $task_dir/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$task_dir/gitleaks.tar.gz" -C "$task_dir" gitleaks
          "$task_dir/gitleaks" git . --log-opts='--all' --redact=100 --no-banner --max-decode-depth 2
          "$task_dir/gitleaks" dir . --redact=100 --no-banner --max-decode-depth 2
